name: Python Quality
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tools
        run: pip install ruff pytest httpx
      - name: Lint with Ruff
        run: ruff check app/ tests/
      - name: Run Pytest
        run: pytest -v tests/
